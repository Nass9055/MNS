<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MNS v5.0 — Trade Navigator Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
<style>
body{font-family:Inter,system-ui;background:#020617;color:#e2e8f0}
.mono{font-family:JetBrains Mono,monospace}
.plan-card{transition:all 0.3s ease}
.glow-emerald{box-shadow:0 0 15px rgba(16,185,129,0.3)}
</style>
</head>
<body class="bg-[#020617]">

<!-- HEADER -->
<header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-800">
  <div class="h-[2px] w-full bg-gradient-to-r from-emerald-500 via-yellow-400 to-indigo-500"></div>
  <div class="max-w-[1600px] mx-auto px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <span class="font-black text-emerald-400 tracking-tighter text-xl">MNS <span class="text-white text-xs bg-emerald-900 px-2 py-0.5 rounded">v5.0</span></span>
    </div>
    <div id="top-nav-brokers" class="flex gap-2"></div>
  </div>
</header>

<main class="max-w-[1600px] mx-auto p-4 grid grid-cols-12 gap-4">
  <!-- ซ้าย: Asset Control -->
  <div class="col-span-12 lg:col-span-3 space-y-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
      <div class="grid grid-cols-3 gap-2 mb-4">
        <button onclick="setTab('FOREX')" class="text-[10px] font-bold p-2 bg-slate-800 rounded-lg">FX</button>
        <button onclick="setTab('GOLD')" class="text-[10px] font-bold p-2 bg-emerald-600 rounded-lg">ทอง/น้ำมัน</button>
        <button onclick="setTab('CRYPTO')" class="text-[10px] font-bold p-2 bg-slate-800 rounded-lg">Crypto</button>
      </div>
      <input id="search" placeholder="ค้นหาสินทรัพย์..." oninput="renderAssets()" class="w-full bg-black border border-slate-700 rounded-lg px-3 py-2 text-xs mb-3">
      <div id="assetList" class="space-y-1 h-[300px] overflow-y-auto"></div>
    </div>
  </div>

  <!-- กลาง: Chart Engine -->
  <div class="col-span-12 lg:col-span-6">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-2 h-[500px]">
      <div id="tradingview_chart_container" class="h-full w-full"></div>
    </div>
  </div>

  <!-- ขวา: PLAN & NAVI Engine -->
  <div class="col-span-12 lg:col-span-3 space-y-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
      <h3 class="text-xs font-black text-slate-400 mb-3">🛠️ MNS NAVIGATOR</h3>
      <div class="space-y-2 mb-4">
        <input id="inpBid" placeholder="Bid Price" class="w-full bg-black border border-slate-700 rounded p-2 text-xs">
        <input id="inpAsk" placeholder="Ask Price" class="w-full bg-black border border-slate-700 rounded p-2 text-xs">
        <button onclick="runMNS()" class="w-full bg-emerald-500 text-black font-bold py-2 rounded-lg text-xs hover:bg-emerald-400">สร้างแผน MAP/PLAN</button>
      </div>
      <div id="planOutput" class="space-y-2"></div>
    </div>
  </div>
</main>

<script>
const ASSETS = {
  FOREX: ["EURUSD","GBPUSD","USDJPY"],
  GOLD: ["GOLD","XAUUSD","SILVER","USOIL"],
  CRYPTO: ["BTCUSD","BTCUSDT","ETHUSDT"]
};
let currentSym = "GOLD";

function setTab(tab) { renderAssets(tab); }

function renderAssets(tab='GOLD') {
  const container = document.getElementById('assetList');
  container.innerHTML = ASSETS[tab].map(s => `
    <button onclick="loadSym('${s}')" class="w-full text-left p-2 hover:bg-slate-800 rounded text-sm ${s===currentSym?'text-emerald-400':''}">${s}</button>
  `).join('');
}

function loadSym(sym) {
  currentSym = sym;
  const container = document.getElementById('tradingview_chart_container');
  container.innerHTML = "";
  new TradingView.widget({
    container_id: "tradingview_chart_container",
    symbol: "OANDA:" + sym,
    interval: "5",
    theme: "dark",
    width: "100%",
    height: "100%"
  });
  renderAssets();
}

function runMNS() {
  const bid = parseFloat(document.getElementById('inpBid').value) || 0;
  const ask = parseFloat(document.getElementById('inpAsk').value) || 0;
  if(!bid || !ask) return alert("กรุณาใส่ราคา");
  
  const mid = (bid+ask)/2;
  const output = document.getElementById('planOutput');
  output.innerHTML = `
    <div class="p-3 bg-slate-800 rounded-lg border-l-4 border-emerald-500">
      <div class="text-[10px] text-emerald-400 font-bold">MAP READY: ${currentSym}</div>
      <div class="text-xl font-black">${mid.toFixed(2)}</div>
      <div class="text-[10px] text-slate-400">แผน: Buy @ ${(mid*0.999).toFixed(2)} | Sell @ ${(mid*1.001).toFixed(2)}</div>
    </div>
  `;
}

// Init
window.onload = () => { loadSym('GOLD'); renderAssets(); };
</script>
</body>
</html>
