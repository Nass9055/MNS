<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MNS — Trade Navigator Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>

body{font-family:Inter,system-ui;background:#020617;color:#e2e8f0}
.mono{font-family:JetBrains Mono,monospace}

.glow-red{box-shadow:0 0 18px rgba(239,68,68,.45)}

</style>
</head>
<body class="bg-[radial-gradient(circle_at_1px_1px,rgba(16,185,129,0.07)_1px,transparent_0)] bg-[length:24px_24px]">

<header class="sticky top-0 z-50 backdrop-blur-xl bg-slate-900/85 border-b border-slate-800">
<div class="h-[2px] w-full bg-gradient-to-r from-emerald-400 via-yellow-400 to-indigo-500"></div>
<div class="max-w-[1600px] mx-auto px-4 py-3 flex flex-wrap items-center gap-3 justify-between">
<div class="flex items-center gap-2.5">
<span class="font-black text-[16px] tracking-widest text-emerald-400">MNS</span>
<span class="text-[10px] font-black tracking-[0.2em] bg-black text-emerald-400 border border-emerald-500/30 px-2.5 py-1 rounded-full">TRADE NAVIGATOR v5.6</span>
</div>
<div class="flex flex-wrap gap-2.5">
<a href="https://i.miactivitys.com/index-th-TH.html?c=FT9GU" target="_blank" class="glow-emerald bg-emerald-500 text-white font-bold text-[13px] px-4 py-2 rounded-full">Mitrade 🏆</a>
<a href="https://one.exnessonelink.com/a/80dmb5wr12" target="_blank" class="glow-yellow bg-yellow-400 text-black font-bold text-[13px] px-4 py-2 rounded-full">Exness ⭐</a>
<a href="https://www.xmglobal.com/referral?token=Jap-L9h7S19cmlEnDtElZA" target="_blank" class="glow-red bg-red-600 text-white font-bold text-[13px] px-4 py-2 rounded-full">XM 🔥</a>
<a href="https://trendo.com/invite?market=googleplay&code=3199411" target="_blank" class="glow-indigo bg-indigo-600 text-white font-bold text-[13px] px-4 py-2 rounded-full">Trendo 🚀</a>
</div>
</div>
</header>

<main class="max-w-[1600px] mx-auto px-4 py-5 grid grid-cols-12 gap-4">
<!-- Sidebar: Asset Map -->
<div class="col-span-12 lg:col-span-3 space-y-4">
<div class="bg-[#1e293b] border border-slate-700/80 rounded-2xl p-4">
<input id="search" placeholder="ค้นหาสัญลักษณ์ (เช่น GOLD, EURUSD)..." oninput="renderAssets()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-[12px] mono mb-3 text-white">
<div id="assetList" class="space-y-1 max-h-[280px] overflow-auto"></div>
</div>
<div class="bg-[#1e293b] border border-slate-700/80 rounded-2xl p-4">
<div class="text-[11px] font-black tracking-widest text-slate-300 mb-2">📰 ปฏิทินเศรษฐกิจ</div>
<iframe src="https://s.tradingview.com/embed-widget/events/?locale=th_TH" style="width:100%;height:160px;border:0"></iframe>
</div>
</div>

<!-- Main: Chart Container -->
<div class="col-span-12 lg:col-span-6">
<div class="bg-[#1e293b] border border-slate-700/80 rounded-2xl p-2">
<div id="tradingview_chart_container" style="height:480px;width:100%;display:flex;align-items:center;justify-content:center;">⏳ กำลังโหลดกราฟ...</div>
</div>
</div>

<!-- Right Panel: Navi & Plan -->
<div class="col-span-12 lg:col-span-3 space-y-4">
<div class="bg-[#1e293b] border border-slate-700/80 rounded-2xl p-4">
<button onclick="analyze()" class="w-full bg-gradient-to-r from-emerald-500 to-cyan-400 text-black font-black py-3 rounded-xl hover:scale-[1.02] transition shadow-lg cursor-pointer">รันระบบวิเคราะห์แบบเต็มระบบ →</button>
</div>
<div id="report" class="bg-[#1e293b] border border-slate-700/80 rounded-2xl p-4 hidden"><div id="reportContent" class="text-[10px] space-y-1"></div></div>
<div id="eventIntelligence" class="bg-[#1e293b] border border-slate-700/80 rounded-2xl p-4 hidden"><div id="eventContent" class="text-[10px] space-y-1"></div></div>
<div id="planList" class="bg-[#1e293b] border border-slate-700/80 rounded-2xl p-4">
<div class="text-[11px] font-bold text-slate-400">แผนกลยุทธ์ (MNS Plan): กดปุ่มวิเคราะห์เพื่อเริ่มประมวลผล</div>
</div>
</div>
</main>

<script>
// Mapping Data Structure สำหรับ 20 สินทรัพย์หลัก
const TVMAP = { 
  "GOLD": "TVC:GOLD", 
  "SILVER": "TVC:SILVER",
  "USOIL": "TVC:USOIL",
  "BRENT": "TVC:UKOIL",
  "BTCUSD": "BITSTAMP:BTCUSD", 
  "ETHUSD": "BITSTAMP:ETHUSD",
  "SOLUSD": "BINANCE:SOLUSDT",
  "EURUSD": "FX:EURUSD",
  "GBPUSD": "FX:GBPUSD",
  "USDJPY": "FX:USDJPY",
  "AUDUSD": "FX:AUDUSD",
  "USDCAD": "FX:USDCAD",
  "NZDUSD": "FX:NZDUSD",
  "EURJPY": "FX:EURJPY",
  "GBPJPY": "FX:GBPJPY",
  "S&P500": "FOREXCOM:SPXUSD",
  "NASDAQ": "FOREXCOM:NSXUSD",
  "DOWJONES": "FOREXCOM:DJI",
  "DAX": "TVC:DAX",
  "NIKKEI": "TVC:NI225"
};

const ASSETS = Object.keys(TVMAP);
let currentSym = "GOLD", currentTF = "5", isWidgetLoading = false;

function loadChart(symbol, interval){
  const container = document.getElementById('tradingview_chart_container');
  if(!window.TradingView){ 
    setTimeout(() => loadChart(symbol, interval), 500); 
    return; 
  }
  if(isWidgetLoading) return;
  isWidgetLoading = true;
  container.innerHTML = ""; 
  try {
    new TradingView.widget({
      container_id: "tradingview_chart_container",
      width: "100%", 
      height: "480",
      symbol: symbol, 
      interval: interval,
      theme: "dark", 
      locale: "th",
      timezone: "Asia/Bangkok"
    });
  } finally {
    setTimeout(() => { isWidgetLoading = false; }, 800);
  }
}

function pick(sym){
  currentSym = sym;
  const targetSymbol = TVMAP[sym] || sym;
  loadChart(targetSymbol, currentTF);
  renderAssets();
}

function renderAssets(){
  const keyword = document.getElementById('search').value.toUpperCase();
  const list = document.getElementById('assetList');
  const filtered = ASSETS.filter(s => s.includes(keyword));
  
  list.innerHTML = filtered.map(s => `
    <div onclick="pick('${s}')" class="p-2.5 rounded-lg cursor-pointer flex justify-between items-center transition ${s===currentSym ? 'bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 font-bold' : 'bg-slate-900 text-slate-300 hover:bg-slate-800'}">
      <span>${s}</span>
      <span class="text-[9px] text-slate-500 mono">${TVMAP[s] || ''}</span>
    </div>
  `).join('');
}

function analyze(){
  document.getElementById('report').classList.remove('hidden');
  document.getElementById('eventIntelligence').classList.remove('hidden');

  // ค่าอ้างอิงเบื้องต้นตามประเภทสินทรัพย์
  let mid = 2385.50, atr = 15.2;
  if(currentSym.includes("BTC")) { mid = 64200; atr = 1200; }
  else if(currentSym.includes("ETH")) { mid = 3500; atr = 90; }
  else if(currentSym.includes("USD") || currentSym.includes("EUR") || currentSym.includes("GBP")) { mid = 1.0850; atr = 0.0045; }
  else if(currentSym.includes("OIL")) { mid = 78.50; atr = 1.2; }
  else if(currentSym.includes("S&P") || currentSym.includes("NASDAQ") || currentSym.includes("DOW")) { mid = 18500; atr = 150; }

  document.getElementById('reportContent').innerHTML = `
    <div class="text-[11px] font-bold text-emerald-400 mb-1">📊 MNS Market Navi (${currentSym})</div>
    <div class="grid grid-cols-2 gap-2 p-2 bg-slate-900 rounded-lg text-[10px]">
      <div class="flex justify-between"><span class="text-slate-500">Structure</span><b class="text-emerald-400">Bullish Breakout</b></div>
      <div class="flex justify-between"><span class="text-slate-500">Liquidity</span><b class="text-yellow-300">High Pool</b></div>
      <div class="flex justify-between"><span class="text-slate-500">Price Location</span><b>Discount Zone</b></div>
      <div class="flex justify-between"><span class="text-slate-500">Market Cycle</span><b>Expansion</b></div>
    </div>`;

  document.getElementById('eventContent').innerHTML = `
    <div class="text-[11px] font-bold text-amber-400 mb-1">🌐 Event Intelligence</div>
    <div class="space-y-1 text-[10px] text-slate-300 bg-slate-900 p-2 rounded">
      <div class="flex justify-between"><span>Active Asset:</span><b class="text-white">${currentSym}</b></div>
      <div class="flex justify-between"><span>Narrative:</span><span>Institutional Flow Active</span></div>
      <div class="flex justify-between"><span>Conflict Risk:</span><b class="text-emerald-400">Low Divergence</b></div>
    </div>`;

  const el = (mid - atr * 0.15).toFixed(2);
  const eh = (mid + atr * 0.15).toFixed(2);
  
  const plans = [
    { name: "Scenario A (Trend Continuation)", state: "ARMED", el: el, tp: (mid + atr * 2).toFixed(2) },
    { name: "Scenario B (Liquidity Sweep)", state: "WATCHING", el: eh, tp: (el - atr).toFixed(2) },
    { name: "Scenario C (Volatility Trap)", state: "STANDBY", el: "N/A", tp: "N/A" }
  ];

  document.getElementById('planList').innerHTML = `
    <div class="text-[11px] font-bold text-slate-300 mb-2">🎯 MNS Actionable Plans</div>
  ` + plans.map(p => `
    <div class="p-2.5 bg-slate-900 rounded-lg border border-slate-700/60 mb-2">
      <div class="flex justify-between text-[11px] font-bold">
        <span class="text-indigo-300">${p.name}</span>
        <span class="px-2 py-0.5 rounded text-[9px] ${p.state==='ARMED'?'bg-emerald-600 text-white':'bg-slate-700 text-slate-300'}">${p.state}</span>
      </div>
      <div class="text-[10px] text-slate-400 mt-1">Entry: <span class="text-white mono">${p.el}</span> | Target: <span class="text-emerald-400 mono">${p.tp}</span></div>
    </div>
  `).join('');
}

window.onload = () => { 
  renderAssets(); 
  pick('GOLD'); 
};
</script>
</body>
  </html>
